# Security scanning: npm audit for dependency vulnerabilities.
# Static sites have a reduced attack surface — the main risk is supply chain.
name: Security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1" # Monday 07:00 UTC

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - run: npm ci

      # Only fail on high/critical — low/moderate in devDeps are not exploitable in static output
      - name: npm audit
        run: npm audit --audit-level=high
