# Security scanning: npm audit for dependency vulnerabilities.
# Static sites have a reduced attack surface — the main risk is supply chain.
name: Security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1" # Monday 07:00 UTC

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - run: npm ci

      # Only fail on high/critical — low/moderate in devDeps are not exploitable in static output
      - name: npm audit
        run: npm audit --audit-level=high
