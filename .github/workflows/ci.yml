# Build validation: ensures the Astro site compiles on every push and PR.
# Deployment is handled separately by the Release workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "tools/cv/requirements.txt"

      - name: Install CV system dependencies
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation

      - name: Install CV Python dependencies
        run: python -m pip install -r tools/cv/requirements.txt

      - name: Build CV
        run: python tools/cv/build_cv.py public/cv.pdf

      - name: Upload CV artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cv-pdf
          path: public/cv.pdf
          if-no-files-found: error
          retention-days: 30

  build:
    needs: cv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - run: npm ci

      - name: Download generated CV
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: cv-pdf
          path: public

      - run: npm run build:site
